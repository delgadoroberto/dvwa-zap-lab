name: DVWA ZAP Baseline Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: dvwa-zap-scan
  cancel-in-progress: true

jobs:
  zap-scan:
    name: Run OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start DVWA Container
        run: |
          docker run -d \
            --name dvwa \
            -p 8080:80 \
            vulnerables/web-dvwa

      - name: Wait for DVWA
        run: |
          echo "Waiting for DVWA to become available..."

          for i in {1..30}; do
            if curl --fail http://localhost:8080 > /dev/null 2>&1; then
              echo "DVWA is ready."
              exit 0
            fi

            sleep 2
          done

          echo "DVWA failed to start."
          docker logs dvwa
          exit 1

      - name: Verify HTTP Response
        run: |
          curl --fail http://localhost:8080

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --user root \
            --network host \
            -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8080 \
            -r zap-report.html \
            -I

      - name: Collect DVWA Logs
        if: always()
        run: |
          docker logs dvwa > dvwa.log

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: zap-report.html

      - name: Upload DVWA Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dvwa-logs
          path: dvwa.log

      - name: Stop DVWA Container
        if: always()
        run: |
          docker stop dvwa
          docker rm dvwa
