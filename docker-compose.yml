services:
  dvwa:
    # Official DVWA Docker image
    image: vulnerables/web-dvwa

    # Friendly container name
    container_name: dvwa

    # Restart automatically unless explicitly stopped
    restart: unless-stopped

    # Expose DVWA on localhost:8080
    ports:
      - "8080:80"

    # Verify that the web application is responding
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - dvwa-network

networks:
  dvwa-network:
    driver: bridge
